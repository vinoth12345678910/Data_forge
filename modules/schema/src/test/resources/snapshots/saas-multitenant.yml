      dims: 0
    nullable: false
  - name: "expires_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: true
  - name: "revoked_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: true
  - name: "last_used_ip"
    type:
      name: "inet"
