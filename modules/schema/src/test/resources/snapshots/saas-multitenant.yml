  - name: "api_keys_scopes_nonempty"
    expr: "(cardinality(scopes) > 0)"
    full: false
- name: "invoice_lines"
  columns:
  - name: "id"
    type:
      name: "int8"
      dims: 0
    nullable: false
    identity: "BY DEFAULT"
  - name: "tenant_id"
    type:
      name: "uuid"
      dims: 0
    nullable: false
  - name: "invoice_id"
    type:
      name: "uuid"
      dims: 0
    nullable: false
  - name: "kind"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "plan_id"
    type:
      name: "int8"
      dims: 0
    nullable: true
  - name: "description"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "quantity"
    type:
      name: "int4"
      dims: 0
    nullable: false
  - name: "unit_amount_minor"
    type:
      name: "int8"
      dims: 0
    nullable: false
  - name: "amount_minor"
    type:
      name: "int8"
      dims: 0
    nullable: false
  - name: "period_start"
    type:
      name: "timestamptz"
      dims: 0
    nullable: false
  - name: "period_end"
    type:
      name: "timestamptz"
      dims: 0
    nullable: false
  pk:
  - "id"
  uniques:
  - name: "invoice_lines_pkey"
    columns:
    - "id"
    primary: true
  fks:
  - name: "invoice_lines_invoice_fk"
    columns:
    - "tenant_id"
    - "invoice_id"
    refTable: "invoices"
    refColumns:
    - "tenant_id"
    - "id"
    deferrable: false
    deferred: false
  - name: "invoice_lines_plan_fk"
    columns:
    - "plan_id"
    refTable: "plans"
    refColumns:
    - "id"
    deferrable: false
    deferred: false
  - name: "invoice_lines_tenant_fk"
    columns:
    - "tenant_id"
    refTable: "tenants"
    refColumns:
    - "id"
    deferrable: false
    deferred: false
  checks:
  - name: "invoice_lines_amount_formula"
    expr: "(amount_minor = ((quantity)::bigint * unit_amount_minor))"
    full: false
  - name: "invoice_lines_kind_valid"
    expr: "(kind = ANY (ARRAY['plan'::text, 'proration_charge'::text, 'proration_credit'::text,\
      \ 'usage'::text]))"
    facts:
    - kind: "in"
      column: "kind"
      op: "="
      values:
      - "plan"
      - "proration_charge"
      - "proration_credit"
      - "usage"
    full: true
  - name: "invoice_lines_period_ordered"
    expr: "(period_start < period_end)"
    facts:
    - kind: "cmp"
      column: "period_start"
      op: "<"
      other: "period_end"
    full: true
  - name: "invoice_lines_quantity_positive"
    expr: "(quantity > 0)"
    facts:
    - kind: "range"
      column: "quantity"
      op: ">"
      values:
      - "0"
    full: true
- name: "invoices"
  columns:
  - name: "id"
    type:
      name: "uuid"
      dims: 0
    nullable: false
  - name: "tenant_id"
    type:
      name: "uuid"
      dims: 0
    nullable: false
  - name: "subscription_id"
    type:
      name: "int8"
      dims: 0
    nullable: false
  - name: "number"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "status"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "period_start"
    type:
      name: "timestamptz"
      dims: 0
    nullable: false
  - name: "period_end"
    type:
      name: "timestamptz"
      dims: 0
    nullable: false
  - name: "issued_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: true
  - name: "due_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: true
  - name: "paid_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: true
  - name: "subtotal_minor"
    type:
      name: "int8"
      dims: 0
    nullable: false
  - name: "tax_minor"
    type:
      name: "int8"
      dims: 0
    nullable: false
  - name: "total_minor"
    type:
      name: "int8"
      dims: 0
    nullable: false
  pk:
  - "id"
  uniques:
  - name: "invoices_pkey"
    columns:
    - "id"
    primary: true
  - name: "invoices_tenant_id_key"
    columns:
    - "tenant_id"
    - "id"
    primary: false
  - name: "invoices_tenant_number_key"
    columns:
    - "tenant_id"
    - "number"
    primary: false
  fks:
  - name: "invoices_subscription_fk"
    columns:
    - "tenant_id"
    - "subscription_id"
    refTable: "subscriptions"
    refColumns:
    - "tenant_id"
    - "id"
    deferrable: false
    deferred: false
  - name: "invoices_tenant_fk"
    columns:
    - "tenant_id"
    refTable: "tenants"
    refColumns:
    - "id"
    deferrable: false
    deferred: false
  checks:
  - name: "invoices_period_ordered"
    expr: "(period_start < period_end)"
    facts:
    - kind: "cmp"
      column: "period_start"
      op: "<"
      other: "period_end"
    full: true
  - name: "invoices_status_times_valid"
    expr: "(((status = 'draft'::text) AND (issued_at IS NULL) AND (paid_at IS NULL))\
      \ OR ((status = ANY (ARRAY['open'::text, 'uncollectible'::text])) AND (issued_at\
      \ IS NOT NULL) AND (due_at IS NOT NULL) AND (paid_at IS NULL)) OR ((status =\
      \ 'paid'::text) AND (issued_at IS NOT NULL) AND (paid_at IS NOT NULL) AND (paid_at\
      \ >= issued_at)) OR ((status = 'void'::text) AND (paid_at IS NULL)))"
    full: false
  - name: "invoices_status_valid"
    expr: "(status = ANY (ARRAY['draft'::text, 'open'::text, 'paid'::text, 'void'::text,\
      \ 'uncollectible'::text]))"
    facts:
    - kind: "in"
      column: "status"
      op: "="
      values:
      - "draft"
      - "open"
      - "paid"
      - "void"
      - "uncollectible"
    full: true
  - name: "invoices_total_formula"
    expr: "(total_minor = (subtotal_minor + tax_minor))"
    full: false
