    where: "(deleted_at IS NULL)"
    primary: false
  - name: "members_pkey"
    columns:
    - "id"
    primary: true
  - name: "members_tenant_id_key"
    columns:
    - "tenant_id"
    - "id"
    primary: false
  fks:
  - name: "members_role_fk"
    columns:
    - "tenant_id"
    - "role_id"
    refTable: "roles"
    refColumns:
    - "tenant_id"
    - "id"
    deferrable: false
    deferred: false
  - name: "members_tenant_fk"
    columns:
    - "tenant_id"
    refTable: "tenants"
    refColumns:
    - "id"
    deferrable: false
    deferred: false
  - name: "members_user_fk"
    columns:
    - "user_id"
    refTable: "users"
    refColumns:
    - "id"
    deferrable: false
    deferred: false
  checks:
  - name: "members_joined_matches_status"
    expr: "(((status = 'invited'::text) AND (joined_at IS NULL)) OR ((status = ANY\
      \ (ARRAY['active'::text, 'suspended'::text])) AND (joined_at IS NOT NULL)) OR\
      \ (status = 'removed'::text))"
    full: false
  - name: "members_removed_iff_deleted"
    expr: "((status = 'removed'::text) = (deleted_at IS NOT NULL))"
    full: false
  - name: "members_status_valid"
    expr: "(status = ANY (ARRAY['invited'::text, 'active'::text, 'suspended'::text,\
      \ 'removed'::text]))"
    facts:
    - kind: "in"
      column: "status"
      op: "="
      values:
      - "invited"
      - "active"
      - "suspended"
      - "removed"
    full: true
