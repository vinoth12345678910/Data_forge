    refColumns:
    - "id"
    deferrable: false
    deferred: false
  checks:
  - name: "inventory_opening_nonneg"
    expr: "(opening_qty >= 0)"
    facts:
    - kind: "range"
      column: "opening_qty"
      op: ">="
      values:
      - "0"
    full: true
  - name: "inventory_reserved_within_on_hand"
    expr: "((reserved >= 0) AND (reserved <= on_hand))"
    facts:
    - kind: "range"
      column: "reserved"
      op: ">="
      values:
      - "0"
    - kind: "cmp"
      column: "reserved"
      op: "<="
      other: "on_hand"
    full: true
