schema: "public"
tables:
- name: "categories"
  columns:
  - name: "id"
    type:
      name: "int8"
      dims: 0
    nullable: false
    identity: "BY DEFAULT"
  - name: "parent_id"
    type:
      name: "int8"
      dims: 0
    nullable: true
  - name: "name"
    type:
      name: "text"
      dims: 0
    nullable: false
  pk:
  - "id"
  uniques:
  - name: "categories_pkey"
    columns:
    - "id"
    primary: true
  - name: "categories_sibling_name_key"
    columns:
    - "name"
    exprs:
    - "COALESCE(parent_id, 0::bigint)"
    primary: false
  fks:
  - name: "categories_parent_fk"
    columns:
    - "parent_id"
    refTable: "categories"
    refColumns:
    - "id"
    deferrable: false
    deferred: false
  checks:
  - name: "categories_not_own_parent"
    expr: "(parent_id <> id)"
    facts:
    - kind: "cmp"
      column: "parent_id"
      op: "<>"
      other: "id"
    full: true
