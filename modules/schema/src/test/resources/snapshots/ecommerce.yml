- name: "coupons"
  columns:
  - name: "id"
    type:
      name: "int8"
      dims: 0
    nullable: false
    identity: "BY DEFAULT"
  - name: "code"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "discount_type"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "value"
    type:
      name: "int4"
      dims: 0
    nullable: false
  - name: "max_uses"
    type:
      name: "int4"
      dims: 0
    nullable: true
  - name: "per_user_limit"
    type:
      name: "int4"
      dims: 0
    nullable: true
  - name: "starts_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: false
  - name: "ends_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: false
  pk:
  - "id"
  uniques:
  - name: "coupons_code_key"
    columns:
    - "code"
    primary: false
  - name: "coupons_pkey"
    columns:
    - "id"
    primary: true
  checks:
  - name: "coupons_limits_positive"
    expr: "((COALESCE(max_uses, 1) > 0) AND (COALESCE(per_user_limit, 1) > 0))"
    full: false
  - name: "coupons_type_valid"
    expr: "(discount_type = ANY (ARRAY['percent'::text, 'fixed'::text]))"
    facts:
    - kind: "in"
      column: "discount_type"
      op: "="
      values:
      - "percent"
      - "fixed"
    full: true
  - name: "coupons_value_valid"
    expr: "(((discount_type = 'percent'::text) AND ((value >= 1) AND (value <= 100)))\
      \ OR ((discount_type = 'fixed'::text) AND (value > 0)))"
    full: false
  - name: "coupons_window_ordered"
    expr: "(starts_at < ends_at)"
    facts:
    - kind: "cmp"
      column: "starts_at"
      op: "<"
      other: "ends_at"
    full: true
