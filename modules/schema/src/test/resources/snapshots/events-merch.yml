    - "warehouse_id"
    refTable: "warehouses"
    refColumns:
    - "id"
    deferrable: false
    deferred: false
  checks:
  - name: "stock_counts_valid"
    expr: "((on_hand >= 0) AND (on_hand <= stocked))"
    facts:
    - kind: "range"
      column: "on_hand"
      op: ">="
      values:
      - "0"
    - kind: "cmp"
      column: "on_hand"
      op: "<="
      other: "stocked"
    full: true
