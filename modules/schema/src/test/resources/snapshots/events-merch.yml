schema: "public"
tables:
- name: "events"
  columns:
  - name: "id"
    type:
      name: "int8"
      dims: 0
    nullable: false
    identity: "BY DEFAULT"
  - name: "name"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "venue"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "city"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "starts_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: false
  - name: "ends_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: false
  - name: "capacity"
    type:
      name: "int4"
      dims: 0
    nullable: false
  - name: "status"
    type:
      name: "text"
      dims: 0
    nullable: false
  - name: "created_by"
    type:
      name: "int8"
      dims: 0
    nullable: false
  - name: "created_at"
    type:
      name: "timestamptz"
      dims: 0
    nullable: false
  pk:
  - "id"
  uniques:
  - name: "events_pkey"
    columns:
    - "id"
    primary: true
  fks:
  - name: "events_created_by_fk"
    columns:
    - "created_by"
    refTable: "users"
    refColumns:
    - "id"
    deferrable: false
    deferred: false
  checks:
  - name: "events_capacity_positive"
    expr: "(capacity > 0)"
    facts:
    - kind: "range"
      column: "capacity"
      op: ">"
      values:
      - "0"
    full: true
  - name: "events_status_valid"
    expr: "(status = ANY (ARRAY['draft'::text, 'on_sale'::text, 'sold_out'::text,\
      \ 'closed'::text, 'cancelled'::text]))"
    facts:
    - kind: "in"
      column: "status"
      op: "="
      values:
      - "draft"
      - "on_sale"
      - "sold_out"
      - "closed"
      - "cancelled"
    full: true
  - name: "events_times_ordered"
    expr: "(starts_at < ends_at)"
    facts:
    - kind: "cmp"
      column: "starts_at"
      op: "<"
      other: "ends_at"
    full: true
